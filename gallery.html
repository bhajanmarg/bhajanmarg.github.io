<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | BhajanMarg</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(
180deg,
#fff9df 0%,
#fff2b8 50%,
#f7d86a 100%
);
color:#222;
min-height:100vh;
transition:.3s;
}

/* HEADER */

header{
background:linear-gradient(
135deg,
#6d0000 0%,
#a00000 40%,
#f4c430 100%
);
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.logo{
font-size:42px;
font-weight:700;
color:white;
}

nav{
display:flex;
align-items:center;
gap:18px;
flex-wrap:wrap;
}

nav a{
color:white;
text-decoration:none;
font-size:18px;
font-weight:600;
}

nav a:hover{
color:#fff5b5;
}

/* BUTTONS */

#languageSwitcher,
#darkModeToggle{
padding:10px 14px;
border:none;
border-radius:10px;
font-size:15px;
font-weight:600;
cursor:pointer;
}

#darkModeToggle{
background:white;
color:#7a0000;
}

/* HERO */

.hero{
text-align:center;
padding:40px 20px;
}

.hero img{
width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
border:6px solid #f4c430;
box-shadow:0 6px 25px rgba(0,0,0,.2);
}

.hero h1{
font-size:60px;
color:#7a0000;
margin-top:20px;
}

.hero p{
font-family:'Noto Serif Devanagari',serif;
font-size:28px;
margin-top:10px;
}

/* GALLERY */

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
padding:30px;
max-width:1400px;
margin:auto;
}

.gallery img{
width:100%;
height:420px;
object-fit:cover;
border-radius:18px;
cursor:pointer;
transition:.35s;
box-shadow:0 8px 25px rgba(0,0,0,.15);
border:4px solid white;
}

.gallery img:hover{
transform:translateY(-8px) scale(1.02);
}

/* LIGHTBOX */

.lightbox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
justify-content:center;
align-items:center;
z-index:9999;
padding:20px;
}

.lightbox img{
max-width:95%;
max-height:95%;
border-radius:15px;
}

.close{
position:absolute;
top:20px;
right:30px;
font-size:40px;
color:white;
cursor:pointer;
}

/* FOOTER */

footer{
background:linear-gradient(
135deg,
#6d0000,
#f4c430
);
color:white;
text-align:center;
padding:20px;
margin-top:40px;
font-weight:bold;
}

/* DARK MODE */

.dark-mode{
background:#121212 !important;
color:white;
}

.dark-mode .hero h1,
.dark-mode .hero p{
color:white;
}

.dark-mode .gallery img{
border:4px solid #333;
}

.dark-mode footer{
background:#222;
}

/* MOBILE */

@media(max-width:768px){

header{
flex-direction:column;
gap:15px;
}

.logo{
font-size:30px;
}

.hero h1{
font-size:42px;
}

.hero p{
font-size:20px;
}

.hero img{
width:140px;
height:140px;
}

.gallery{
grid-template-columns:1fr;
padding:20px;
}

.gallery img{
height:auto;
}

}

</style></head>

<body>

<header>

<div class="logo">
BhajanMarg
</div>

<nav>

<a href="index.html">Home</a>
<a href="quotes.html">Quotes</a>
<a href="links.html">Links</a>
<a href="gallery.html">Gallery</a>
<a href="jaap.html">Jaap</a>

<select id="languageSwitcher">
<option value="hi">🇮🇳 हिन्दी</option>
<option value="en">🇬🇧 English</option>
</select>

<button id="darkModeToggle">
🌙 Dark Mode
</button>

</nav>

</header>

<section class="hero">

<img src="gurudev.png" alt="Gurudev">

<h1 id="pageTitle">BhajanMarg</h1>

<p id="pageSubtitle">
श्री हित प्रेमानंद जी महाराज
</p>

</section>

<div class="gallery">

<img src="images/photo_1_2026-09-19_18-07-53.jpg" onclick="openImg(this.src)">
<img src="images/photo_2_2026-09-19_18-07-53.jpg" onclick="openImg(this.src)">
<img src="images/photo_3_2026-09-19_18-07-53.jpg" onclick="openImg(this.src)">
<img src="images/photo_4_2026-09-19_18-07-53.jpg" onclick="openImg(this.src)">
<img src="images/photo_5_2026-09-19_18-07-53.jpg" onclick="openImg(this.src)">
<img src="images/photo_6_2026-09-19_18-07-53.jpg" onclick="openImg(this.src)">
<img src="images/photo_7_2026-09-19_18-07-53.jpg" onclick="openImg(this.src)">
<img src="images/photo_8_2026-09-19_18-07-53.jpg" onclick="openImg(this.src)">
<img src="images/photo_9_2026-09-19_18-07-53.jpg" onclick="openImg(this.src)">

</div>

<div class="lightbox" id="lightbox">

<span class="close" onclick="closeImg()">
×
</span>

<img id="showimg">

</div>

<footer id="footerText">
© BhajanMarg | जय श्री राधे
</footer>

<script>

function openImg(src){

document.getElementById("lightbox").style.display="flex";

document.getElementById("showimg").src=src;

}

function closeImg(){

document.getElementById("lightbox").style.display="none";

}

/* DARK MODE */

const darkBtn=
document.getElementById("darkModeToggle");

if(localStorage.getItem("theme")==="dark"){

document.body.classList.add("dark-mode");

darkBtn.innerHTML="☀️ Light Mode";

}

darkBtn.addEventListener("click",()=>{

document.body.classList.toggle("dark-mode");

if(document.body.classList.contains("dark-mode")){

localStorage.setItem("theme","dark");

darkBtn.innerHTML="☀️ Light Mode";

}else{

localStorage.setItem("theme","light");

darkBtn.innerHTML="🌙 Dark Mode";

}

});

/* LANGUAGE */

const languageSwitcher=
document.getElementById("languageSwitcher");

const translations={

hi:{
subtitle:"श्री हित प्रेमानंद जी महाराज",
footer:"© BhajanMarg | जय श्री राधे"
},

en:{
subtitle:"Shri Hit Premanand Ji Maharaj",
footer:"© BhajanMarg | Jai Shri Radhe"
}

};

function applyLanguage(lang){

document.getElementById("pageSubtitle").innerText=
translations[lang].subtitle;

document.getElementById("footerText").innerText=
translations[lang].footer;

}

let savedLanguage=
localStorage.getItem("language") || "hi";

languageSwitcher.value=savedLanguage;

applyLanguage(savedLanguage);

languageSwitcher.addEventListener("change",function(){

localStorage.setItem(
"language",
this.value
);

applyLanguage(this.value);

});

</script>

</body>
</html>
