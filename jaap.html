<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>राधे राधे नाम जप | BhajanMarg</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Noto Sans Devanagari',Arial,sans-serif;
background:linear-gradient(
180deg,
#fff9df 0%,
#fff2b8 50%,
#f7d86a 100%
);
min-height:100vh;
transition:.4s;
color:#222;
}

body.dark{
background:linear-gradient(
180deg,
#121212,
#1d1d1d,
#2b2b2b
);
color:white;
}

/* ===== NAVBAR ===== */

header{
background:linear-gradient(
135deg,
#6d0000 0%,
#a00000 40%,
#f4c430 100%
);
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:999;
box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.logo{
font-size:38px;
font-weight:bold;
color:white;
}

nav{
display:flex;
gap:18px;
align-items:center;
flex-wrap:wrap;
}

nav a{
color:white;
text-decoration:none;
font-size:18px;
font-weight:bold;
}

nav a:hover{
color:#fff4a8;
}

.langSelect{
padding:8px 12px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.darkBtnTop{
background:white;
border:none;
padding:10px 15px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

/* ===== MAIN CARD ===== */

.wrapper{
padding:30px 15px;
}

.card{
background:white;
max-width:850px;
margin:auto;
padding:35px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.18);
text-align:center;
transition:.4s;
}

.dark .card{
background:#222;
}

.heroImg{
width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
border:6px solid #f4c430;
box-shadow:0 6px 25px rgba(0,0,0,.2);
margin-bottom:20px;
}

h1{
font-size:50px;
color:#7a0000;
margin-bottom:15px;
}

.dark h1{
color:#ffd84d;
}

.count{
font-size:80px;
font-weight:bold;
color:#7a0000;
margin-top:10px;
}

.dark .count{
color:#ffd84d;
}

.mala{
font-size:28px;
margin-top:10px;
}

.remain{
font-size:20px;
margin-top:10px;
opacity:.85;
}

.progressBox{
width:100%;
height:18px;
background:#ddd;
border-radius:20px;
margin-top:25px;
overflow:hidden;
}

.dark .progressBox{
background:#444;
}

.progress{
height:100%;
width:0%;
background:linear-gradient(
90deg,
#7a0000,
#f4c430
);
transition:.3s;
}.jaapBtn{
background:linear-gradient(
135deg,
#7a0000,
#d18f00
);
color:white;
border:none;
padding:22px 45px;
font-size:30px;
border-radius:18px;
cursor:pointer;
margin-top:25px;
transition:.15s;
box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.jaapBtn:active{
transform:scale(.92);
}

.resetBtn{
background:#444;
color:white;
border:none;
padding:16px 30px;
font-size:22px;
border-radius:12px;
cursor:pointer;
margin-top:15px;
}

.back{
display:inline-block;
margin-top:25px;
font-size:20px;
font-weight:bold;
text-decoration:none;
color:#7a0000;
}

.dark .back{
color:#ffd84d;
}

.flower{
position:absolute;
font-size:30px;
pointer-events:none;
animation:floatUp 1.4s linear forwards;
}

.radhe{
position:absolute;
font-weight:bold;
font-size:24px;
color:#c00000;
pointer-events:none;
animation:radheUp 1.5s linear forwards;
}

@keyframes floatUp{
0%{
opacity:1;
transform:translateY(0) scale(1);
}
100%{
opacity:0;
transform:translateY(-120px) scale(1.8);
}
}

@keyframes radheUp{
0%{
opacity:1;
transform:translateY(0);
}
100%{
opacity:0;
transform:translateY(-100px);
}
}

footer{
background:linear-gradient(
135deg,
#6d0000,
#f4c430
);
color:white;
text-align:center;
padding:20px;
margin-top:40px;
font-weight:bold;
}

@media(max-width:768px){

header{
flex-direction:column;
gap:15px;
}

.logo{
font-size:30px;
}

h1{
font-size:38px;
}

.count{
font-size:60px;
}

.heroImg{
width:140px;
height:140px;
}

.jaapBtn{
font-size:24px;
padding:18px 35px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">BhajanMarg</div>

<nav>

<a href="index.html">Home</a>
<a href="quotes.html">Quotes</a>
<a href="links.html">Links</a>
<a href="gallery.html">Gallery</a>
<a href="jaap.html">Jaap</a>

<select class="langSelect">
<option>🇮🇳 हिन्दी</option>
<option>🇬🇧 English</option>
</select>

<button class="darkBtnTop" onclick="toggleDark()">
🌙 Dark Mode
</button>

</nav>

</header>

<div class="wrapper">

<div class="card">

<img src="gurudev.png" class="heroImg">

<h1>🌸 राधे राधे नाम जप 🌸</h1>

<div class="count" id="count">0</div>

<div class="mala">
📿 पूर्ण माला:
<span id="mala">0</span>
</div>

<div class="remain">
अगली माला तक शेष:
<span id="remain">108</span>
</div>

<div class="progressBox">
<div class="progress" id="progress"></div>
</div>

<button class="jaapBtn" onclick="addJaap()">
राधे राधे
</button>

<br>

<button class="resetBtn" onclick="resetJaap()">
Reset
</button>

<br>

<a href="index.html" class="back">
← Home Page
</a>

</div>

</div>

<footer>
© BhajanMarg
</footer>

<script>

let count=
parseInt(localStorage.getItem("jaapCount"))||0;

updateScreen();

function addJaap(){

count++;

localStorage.setItem(
"jaapCount",
count
);

if(navigator.vibrate){
navigator.vibrate(40);
}

createFlower();
createRadhe();

updateScreen();

}

function updateScreen(){

document.getElementById("count").innerText=count;

let mala=Math.floor(count/108);

document.getElementById("mala").innerText=mala;

let remain=108-(count%108);

if(remain===108){
remain=0;
}

document.getElementById("remain").innerText=remain;

let percent=((count%108)/108)*100;

document.getElementById("progress").style.width=
percent+"%";

}

function resetJaap(){

if(confirm("क्या आप जप रीसेट करना चाहते हैं?")){

count=0;

localStorage.setItem(
"jaapCount",
0
);

updateScreen();

}

}

function createFlower(){

let flower=document.createElement("div");

flower.className="flower";
flower.innerHTML="🌸";

flower.style.left=
(45+Math.random()*10)+"%";

flower.style.top="55%";

document.body.appendChild(flower);

setTimeout(()=>{
flower.remove();
},1400);

}

function createRadhe(){

let radhe=document.createElement("div");

radhe.className="radhe";

radhe.innerHTML="राधे";

radhe.style.left=
(45+Math.random()*10)+"%";

radhe.style.top="55%";

document.body.appendChild(radhe);

setTimeout(()=>{
radhe.remove();
},1500);

}

function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(
"darkMode",
document.body.classList.contains("dark")
);

}

if(localStorage.getItem("darkMode")==="true"){
document.body.classList.add("dark");
}

</script>

</body>
</html>
