<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Links | BhajanMarg</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(
180deg,
#fff9df 0%,
#fff2b8 50%,
#f7d86a 100%
);
color:#222;
min-height:100vh;
transition:.4s;
}

header{
background:linear-gradient(
135deg,
#6d0000 0%,
#a00000 40%,
#f4c430 100%
);
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.logo{
font-size:40px;
font-weight:bold;
color:white;
}

nav{
display:flex;
gap:15px;
align-items:center;
flex-wrap:wrap;
}

nav a{
color:white;
text-decoration:none;
font-size:18px;
font-weight:bold;
}

nav a:hover{
color:#fff5b5;
}

#darkBtn,
#langSelect{
border:none;
padding:10px 12px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

#darkBtn{
background:white;
color:#7a0000;
}

.hero{
text-align:center;
padding:40px 20px;
}

.hero img{
width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
border:6px solid #f4c430;
box-shadow:0 6px 25px rgba(0,0,0,.2);
}

.hero h1{
font-size:60px;
color:#7a0000;
margin-top:20px;
}

.hero p{
font-size:24px;
margin-top:10px;
}

.card{
background:#fffdf0;
max-width:850px;
margin:25px auto;
padding:35px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.12);
text-align:center;
border-top:6px solid #f4c430;
}

.card h2{
color:#7a0000;
margin-bottom:15px;
font-size:32px;
}

.card p{
font-size:18px;
line-height:1.7;
margin-bottom:20px;
}

.btn{
display:inline-block;
padding:14px 28px;
background:linear-gradient(
135deg,
#7a0000,
#c79200
);
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
font-size:18px;
}

footer{
background:linear-gradient(
135deg,
#6d0000,
#f4c430
);
color:white;
text-align:center;
padding:22px;
margin-top:50px;
font-weight:bold;
}

/* DARK MODE */

.dark{
background:#111 !important;
color:#eee !important;
}

.dark .card{
background:#1e1e1e;
color:#eee;
}

.dark .card h2{
color:#f4c430;
}

.dark header{
background:linear-gradient(
135deg,
#2b0000,
#5a0000,
#b8860b
);
}

.dark footer{
background:linear-gradient(
135deg,
#2b0000,
#b8860b
);
}

@media(max-width:768px){

header{
flex-direction:column;
gap:15px;
}

.logo{
font-size:30px;
}

.hero h1{
font-size:42px;
}

.hero p{
font-size:18px;
}

.hero img{
width:140px;
height:140px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
BhajanMarg
</div>

<nav>

<a href="index.html">Home</a>
<a href="quotes.html">Quotes</a>
<a href="links.html">Links</a>
<a href="gallery.html">Gallery</a>
<a href="jaap.html">Jaap</a>

<select id="langSelect" onchange="changeLanguage()">
<option value="hi">🇮🇳 हिन्दी</option>
<option value="en">🇬🇧 English</option>
</select>

<button id="darkBtn" onclick="toggleDarkMode()">
🌙 Dark Mode
</button>

</nav>

</header>

<section class="hero">

<img src="gurudev.png">

<h1>BhajanMarg</h1>

<p id="heroText">
भक्ति • प्रेम • नाम स्मरण
</p>

</section>

<div id="linksContainer"></div><footer id="footerText">
© BhajanMarg | जय श्री राधे
</footer>

<script>

fetch('links.json')
.then(response => response.json())
.then(data => {

const container =
document.getElementById('linksContainer');

data.forEach(link => {

container.innerHTML += `

<div class="card">

<h2>${link.title}</h2>

<p>${link.description}</p>

<a class="btn"
href="${link.url}"
target="_blank">

<span class="openText">खोलें ↗</span>

</a>

</div>

`;

});

})
.catch(error => {

document.getElementById('linksContainer').innerHTML =

`

<div class="card">

<h2>⚠️ लिंक लोड नहीं हुए</h2>

<p>
links.json फाइल नहीं मिली या उसमें त्रुटि है।
</p>

</div>

`;

console.error(error);

});

/* DARK MODE */

function toggleDarkMode(){

document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){

localStorage.setItem("theme","dark");

document.getElementById("darkBtn").innerHTML =
"☀️ Light Mode";

}else{

localStorage.setItem("theme","light");

document.getElementById("darkBtn").innerHTML =
"🌙 Dark Mode";

}

}

if(localStorage.getItem("theme")==="dark"){

document.body.classList.add("dark");

document.getElementById("darkBtn").innerHTML =
"☀️ Light Mode";

}

/* LANGUAGE */

const translations = {

hi:{
hero:"भक्ति • प्रेम • नाम स्मरण",
footer:"© BhajanMarg | जय श्री राधे",
open:"खोलें ↗"
},

en:{
hero:"Devotion • Love • Holy Name",
footer:"© BhajanMarg | Jai Shri Radhe",
open:"Open ↗"
}

};

function applyLanguage(lang){

document.getElementById("heroText").innerText =
translations[lang].hero;

document.getElementById("footerText").innerText =
translations[lang].footer;

setTimeout(()=>{

document.querySelectorAll(".openText")
.forEach(btn=>{

btn.innerText =
translations[lang].open;

});

},300);

}

function changeLanguage(){

const lang =
document.getElementById("langSelect").value;

localStorage.setItem(
"language",
lang
);

applyLanguage(lang);

}

const savedLanguage =
localStorage.getItem("language") || "hi";

document.getElementById("langSelect").value =
savedLanguage;

applyLanguage(savedLanguage);

</script>

</body>
</html>
