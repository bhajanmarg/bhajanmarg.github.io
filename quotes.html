<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quotes | BhajanMarg</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(
180deg,
#fff9df 0%,
#fff2b8 50%,
#f7d86a 100%
);
color:#222;
min-height:100vh;
transition:.4s;
}

header{
background:linear-gradient(
135deg,
#6d0000 0%,
#a00000 40%,
#f4c430 100%
);
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.logo{
font-size:38px;
font-weight:bold;
color:white;
}

nav{
display:flex;
gap:15px;
align-items:center;
flex-wrap:wrap;
}

nav a{
color:white;
text-decoration:none;
font-size:18px;
font-weight:bold;
}

nav a:hover{
color:#fff5b5;
}

#darkBtn,
#langSelect{
border:none;
padding:10px 12px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

#darkBtn{
background:white;
color:#7a0000;
}

.pageTitle{
text-align:center;
padding:40px 20px 20px;
}

.pageTitle h1{
font-size:50px;
color:#7a0000;
margin-bottom:10px;
}

.pageTitle p{
font-size:20px;
}

.searchBox{
text-align:center;
margin:20px;
}

#search{
width:500px;
max-width:90%;
padding:15px;
font-size:18px;
border-radius:12px;
border:2px solid #f4c430;
outline:none;
}

.counterBox{
text-align:center;
font-size:24px;
font-weight:bold;
color:#7a0000;
margin-bottom:20px;
}

.quote{
background:#fffdf0;
max-width:950px;
margin:20px auto;
padding:30px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.12);
border-left:8px solid #f4c430;
}

.quote h3{
color:#7a0000;
font-size:24px;
margin-bottom:15px;
}

.quote p{
font-size:22px;
line-height:1.8;
}

.quoteButtons{
margin-top:20px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.copyBtn{
background:#7a0000;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.whatsappBtn{
background:#25D366;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

footer{
background:linear-gradient(
135deg,
#6d0000,
#f4c430
);
color:white;
text-align:center;
padding:22px;
margin-top:50px;
font-weight:bold;
}

.dark{
background:#111 !important;
color:#eee !important;
}

.dark .quote{
background:#1e1e1e;
color:#eee;
}

.dark .quote h3{
color:#f4c430;
}

.dark .counterBox{
color:#f4c430;
}

.dark header{
background:linear-gradient(
135deg,
#2b0000,
#5a0000,
#b8860b
);
}

.dark footer{
background:linear-gradient(
135deg,
#2b0000,
#b8860b
);
}

@media(max-width:768px){

header{
flex-direction:column;
gap:15px;
}

.logo{
font-size:30px;
}

.pageTitle h1{
font-size:36px;
}

.quote p{
font-size:18px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
BhajanMarg
</div>

<nav>

<a href="index.html">Home</a>
<a href="quotes.html">Quotes</a>
<a href="links.html">Links</a>
<a href="gallery.html">Gallery</a>
<a href="jaap.html">Jaap</a>

<select id="langSelect" onchange="changeLanguage()">
<option value="hi">🇮🇳 हिन्दी</option>
<option value="en">🇬🇧 English</option>
</select>

<button id="darkBtn" onclick="toggleDarkMode()">
🌙 Dark Mode
</button>

</nav>

</header>

<section class="pageTitle">

<h1 id="title">
प्रेरणादायक विचार
</h1>

<p id="subtitle">
प्रतिदिन नए आध्यात्मिक विचार पढ़ें
</p>

</section>

<div class="searchBox">

<input
id="search"
placeholder="विचार खोजें..."
>

</div>

<div class="counterBox">
कुल विचार:
<span id="quoteCount">0</span>
</div>

<div id="quotes"></div><footer>
© BhajanMarg | Jai Shri Radhe
</footer>

<script>

let allQuotes = [];

const translations = {

hi:{
title:"प्रेरणादायक विचार",
subtitle:"प्रतिदिन नए आध्यात्मिक विचार पढ़ें",
search:"विचार खोजें..."
},

en:{
title:"Inspirational Quotes",
subtitle:"Read daily spiritual thoughts",
search:"Search Quotes..."
}

};

function applyLanguage(lang){

document.documentElement.lang = lang;

document.getElementById("title").innerText =
translations[lang].title;

document.getElementById("subtitle").innerText =
translations[lang].subtitle;

document.getElementById("search").placeholder =
translations[lang].search;

}

function changeLanguage(){

let lang =
document.getElementById("langSelect").value;

localStorage.setItem(
"language",
lang
);

applyLanguage(lang);

}

let savedLanguage =
localStorage.getItem("language") || "hi";

document.getElementById("langSelect").value =
savedLanguage;

applyLanguage(savedLanguage);

/* Load Quotes */

fetch("quotes.json")

.then(response => response.json())

.then(data => {

allQuotes = [...data];

shuffleQuotes();

showQuotes(allQuotes);

})

.catch(error => {

document.getElementById("quotes").innerHTML =

`

<div class="quote">

<h3>⚠️ Error</h3>

<p>quotes.json load nahi hua.</p>

</div>

`;

console.error(error);

});

/* Random Quotes */

function shuffleQuotes(){

for(
let i = allQuotes.length - 1;
i > 0;
i--
){

let j =
Math.floor(
Math.random() * (i + 1)
);

[allQuotes[i],allQuotes[j]]
=
[allQuotes[j],allQuotes[i]];

}

}

/* Show Quotes */

function showQuotes(arr){

const div =
document.getElementById("quotes");

div.innerHTML = "";

document.getElementById("quoteCount").innerText =
arr.length;

arr.forEach(q => {

div.innerHTML += `

<div class="quote">

<h3>${q.date}</h3>

<p>${q.quote}</p>

<div class="quoteButtons">

<button
class="copyBtn"
onclick="copyQuote(\`${q.quote}\`)">
📋 Copy
</button>

<button
class="whatsappBtn"
onclick="shareWhatsApp(\`${q.quote}\`)">
📱 WhatsApp
</button>

</div>

</div>

`;

});

}

/* Search */

document
.getElementById("search")
.addEventListener("input",function(){

const value =
this.value.toLowerCase();

if(value===""){

showQuotes(allQuotes);

return;

}

const filtered =

allQuotes.filter(q =>

q.quote
.toLowerCase()
.includes(value)

);

showQuotes(filtered);

});

/* Copy Quote */

function copyQuote(text){

navigator.clipboard.writeText(text);

alert("Quote Copied ✅");

}

/* WhatsApp Share */

function shareWhatsApp(text){

window.open(
"https://wa.me/?text=" +
encodeURIComponent(text),
"_blank"
);

}

/* Dark Mode */

function toggleDarkMode(){

document.body.classList.toggle("dark");

if(
document.body.classList.contains("dark")
){

localStorage.setItem(
"theme",
"dark"
);

document.getElementById("darkBtn")
.innerHTML =
"☀️ Light Mode";

}else{

localStorage.setItem(
"theme",
"light"
);

document.getElementById("darkBtn")
.innerHTML =
"🌙 Dark Mode";

}

}

if(
localStorage.getItem("theme")
==="dark"
){

document.body.classList.add("dark");

document.getElementById("darkBtn")
.innerHTML =
"☀️ Light Mode";

}

</script>

</body>
</html>
