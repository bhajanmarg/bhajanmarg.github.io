<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quotes | BhajanMarg</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(
180deg,
#fff9df 0%,
#fff2b8 50%,
#f7d86a 100%
);
color:#222;
min-height:100vh;
transition:.4s;
}

header{
background:linear-gradient(
135deg,
#6d0000 0%,
#a00000 40%,
#f4c430 100%
);
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.logo{
font-size:40px;
font-weight:bold;
color:white;
text-shadow:2px 2px 4px rgba(0,0,0,.3);
}

nav{
display:flex;
gap:15px;
align-items:center;
flex-wrap:wrap;
}

nav a{
color:white;
text-decoration:none;
font-size:18px;
font-weight:bold;
transition:.3s;
}

nav a:hover{
color:#fff5b5;
}

#darkBtn,
#langSelect{
border:none;
padding:10px 12px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

#darkBtn{
background:white;
color:#7a0000;
}

.hero{
text-align:center;
padding:40px 20px;
}

.hero img{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:6px solid #f4c430;
box-shadow:0 6px 25px rgba(0,0,0,.2);
}

.hero h1{
font-size:58px;
color:#7a0000;
margin-top:20px;
}

.hero p{
font-size:22px;
max-width:900px;
margin:15px auto;
line-height:1.8;
}

.searchBox{
max-width:850px;
margin:20px auto;
padding:0 20px;
}

#search{
width:100%;
padding:16px;
border:none;
border-radius:12px;
font-size:18px;
outline:none;
box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.quote{
background:#fffdf0;
max-width:950px;
margin:25px auto;
padding:30px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.12);
border-top:6px solid #f4c430;
}

.quote h3{
color:#7a0000;
font-size:28px;
margin-bottom:15px;
}

.quote p{
font-size:22px;
line-height:1.8;
}

.noResult{
text-align:center;
padding:40px;
font-size:24px;
font-weight:bold;
color:#7a0000;
}

footer{
background:linear-gradient(
135deg,
#6d0000,
#f4c430
);
color:white;
text-align:center;
padding:22px;
margin-top:50px;
font-weight:bold;
}

/* DARK MODE */

.dark{
background:#111 !important;
color:#eee !important;
}

.dark .quote{
background:#1e1e1e;
color:#eee;
}

.dark .quote h3{
color:#f4c430;
}

.dark header{
background:linear-gradient(
135deg,
#2b0000,
#5a0000,
#b8860b
);
}

.dark footer{
background:linear-gradient(
135deg,
#2b0000,
#b8860b
);
}

.dark .hero h1{
color:#f4c430;
}

.dark #search{
background:#1e1e1e;
color:white;
}

@media(max-width:768px){

header{
flex-direction:column;
gap:15px;
}

.logo{
font-size:30px;
}

.hero h1{
font-size:42px;
}

.hero p{
font-size:18px;
}

.hero img{
width:150px;
height:150px;
}

.quote{
margin:15px;
padding:22px;
}

.quote h3{
font-size:22px;
}

.quote p{
font-size:18px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
BhajanMarg
</div>

<nav>

<a href="index.html">Home</a>
<a href="quotes.html">Quotes</a>
<a href="links.html">Links</a>
<a href="gallery.html">Gallery</a>
<a href="jaap.html">Jaap</a>

<select id="langSelect">
<option value="hi">🇮🇳 हिन्दी</option>
<option value="en">🇬🇧 English</option>
</select>

<button id="darkBtn">
🌙 Dark Mode
</button>

</nav>

</header>

<section class="hero">

<img src="gurudev.png" alt="Gurudev">

<h1 id="pageTitle">
प्रेरणादायक विचार
</h1>

<p id="pageText">
प्रतिदिन नए आध्यात्मिक विचार पढ़ें और जीवन में अपनाएँ।
</p>

</section>

<div class="searchBox">

<input
id="search"
placeholder="Quote या Date Search">

</div>

<div id="quotes"></div>

<footer id="footerText">
© BhajanMarg | जय श्री राधे
</footer>

<script>const quoteTranslations = {

"राधे नाम का स्मरण मन को शांति और आनंद प्रदान करता है।":
"Remembering the name of Radhe brings peace and joy to the mind.",

"भगवान का नाम ही जीवन का सबसे बड़ा सहारा है।":
"The name of God is the greatest support in life.",

"प्रेम और भक्ति से किया गया स्मरण प्रभु तक पहुँचता है।":
"Remembrance performed with love and devotion reaches the Lord.",

"हर परिस्थिति में राधे राधे का जाप मन को स्थिर रखता है।":
"Chanting Radhe Radhe keeps the mind steady in every situation.",

"सच्ची भक्ति वही है जिसमें अहंकार का स्थान न हो।":
"True devotion leaves no room for ego.",

"श्री राधा की कृपा से जीवन में मधुरता आती है।":
"By the grace of Shri Radha, sweetness enters life.",

"नाम जप से मन निर्मल और हृदय प्रसन्न होता है।":
"Chanting the holy name purifies the mind and gladdens the heart."

};

const uiText = {

hi:{
title:"प्रेरणादायक विचार",
desc:"प्रतिदिन नए आध्यात्मिक विचार पढ़ें और जीवन में अपनाएँ।",
search:"Quote या Date Search",
footer:"© BhajanMarg | जय श्री राधे",
dark:"🌙 Dark Mode",
light:"☀️ Light Mode",
empty:"कोई Quote नहीं मिला"
},

en:{
title:"Inspirational Quotes",
desc:"Read daily spiritual thoughts and apply them in life.",
search:"Search Quote or Date",
footer:"© BhajanMarg | Jai Shri Radhe",
dark:"🌙 Dark Mode",
light:"☀️ Light Mode",
empty:"No Quotes Found"
}

};

let allQuotes=[];
let currentLanguage=
localStorage.getItem("language") || "hi";

/* DATE PARSER */

function parseDate(dateStr){

const months={
Jan:0,
Feb:1,
Mar:2,
Apr:3,
May:4,
Jun:5,
Jul:6,
Aug:7,
Sep:8,
Oct:9,
Nov:10,
Dec:11
};

const parts=dateStr.split(" ");

if(parts.length!==3){
return new Date(0);
}

return new Date(
parseInt(parts[2]),
months[parts[1]],
parseInt(parts[0])
);

}

/* SHOW QUOTES */

function showQuotes(arr){

const div=
document.getElementById("quotes");

div.innerHTML="";

if(arr.length===0){

div.innerHTML=`
<div class="noResult">
${uiText[currentLanguage].empty}
</div>
`;

return;
}

arr.forEach(q=>{

let quoteText=q.quote;

if(currentLanguage==="en"){
quoteText=
quoteTranslations[q.quote] || q.quote;
}

div.innerHTML+=`

<div class="quote">

<h3>${q.date}</h3>

<p>${quoteText}</p>

</div>

`;

});

}

/* LOAD QUOTES */

fetch("quotes.json")
.then(r=>r.json())
.then(data=>{

const today=new Date();

today.setHours(23,59,59,999);

allQuotes=data.filter(q=>
parseDate(q.date)<=today
);

allQuotes.sort((a,b)=>
parseDate(b.date)-parseDate(a.date)
);

showQuotes(allQuotes);

});

/* SEARCH */

document
.getElementById("search")
.addEventListener("input",e=>{

const value=
e.target.value
.toLowerCase()
.trim();

const filtered=
allQuotes.filter(q=>{

let text=q.quote.toLowerCase();

let eng=
(
quoteTranslations[q.quote] || ""
).toLowerCase();

return(

text.includes(value)

||

eng.includes(value)

||

q.date
.toLowerCase()
.includes(value)

);

});

showQuotes(filtered);

});

/* LANGUAGE */

function applyLanguage(){

document.getElementById("pageTitle")
.innerText=
uiText[currentLanguage].title;

document.getElementById("pageText")
.innerText=
uiText[currentLanguage].desc;

document.getElementById("search")
.placeholder=
uiText[currentLanguage].search;

document.getElementById("footerText")
.innerText=
uiText[currentLanguage].footer;

showQuotes(allQuotes);

}

document
.getElementById("langSelect")
.value=currentLanguage;

document
.getElementById("langSelect")
.addEventListener("change",function(){

currentLanguage=this.value;

localStorage.setItem(
"language",
currentLanguage
);

applyLanguage();

});

/* DARK MODE */

function updateThemeButton(){

const btn=
document.getElementById("darkBtn");

if(
document.body.classList.contains("dark")
){

btn.innerHTML=
uiText[currentLanguage].light;

}else{

btn.innerHTML=
uiText[currentLanguage].dark;

}

}

document
.getElementById("darkBtn")
.addEventListener("click",()=>{

document.body.classList.toggle("dark");

if(
document.body.classList.contains("dark")
){

localStorage.setItem(
"theme",
"dark"
);

}else{

localStorage.setItem(
"theme",
"light"
);

}

updateThemeButton();

});

if(
localStorage.getItem("theme")
==="dark"
){

document.body.classList.add("dark");

}

applyLanguage();
updateThemeButton();

</script>

</body>
</html>
