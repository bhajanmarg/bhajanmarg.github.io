<script>

let allQuotes = [];

const translations = {

hi:{
title:"प्रेरणादायक विचार",
subtitle:"प्रतिदिन नए आध्यात्मिक विचार पढ़ें",
search:"विचार खोजें..."
},

en:{
title:"Inspirational Quotes",
subtitle:"Read spiritual thoughts every day",
search:"Search Quotes..."
}

};

function applyLanguage(lang){

document.documentElement.lang = lang;

document.getElementById("title").innerText =
translations[lang].title;

document.getElementById("subtitle").innerText =
translations[lang].subtitle;

document.getElementById("search").placeholder =
translations[lang].search;

}

function changeLanguage(){

const lang =
document.getElementById("langSelect").value;

localStorage.setItem("language",lang);

applyLanguage(lang);

}

const savedLanguage =
localStorage.getItem("language") || "hi";

document.getElementById("langSelect").value =
savedLanguage;

applyLanguage(savedLanguage);

fetch("quotes.json")
.then(response => response.json())
.then(data => {

allQuotes = [...data];

shuffleQuotes();

showQuotes(allQuotes);

})
.catch(error => {

document.getElementById("quotes").innerHTML = `

<div class="quote">

<h3>⚠️ Error</h3>

<p>quotes.json load नहीं हुआ।</p>

</div>

`;

console.error(error);

});

function shuffleQuotes(){

for(let i=allQuotes.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[allQuotes[i],allQuotes[j]]
=
[allQuotes[j],allQuotes[i]];

}

}

function showQuotes(arr){

const div =
document.getElementById("quotes");

div.innerHTML = "";

arr.forEach(q => {

div.innerHTML += `

<div class="quote">

<h3>${q.date}</h3>

<p>${q.quote}</p>

</div>

`;

});

}

document
.getElementById("search")
.addEventListener("input",function(){

const value =
this.value.toLowerCase();

const filtered =
allQuotes.filter(q =>
q.quote.toLowerCase().includes(value)
);

showQuotes(filtered);

});

function toggleDarkMode(){

document.body.classList.toggle("dark");

localStorage.setItem(
"darkMode",
document.body.classList.contains("dark")
);

}

if(localStorage.getItem("darkMode")==="true"){

document.body.classList.add("dark");

}

</script>
