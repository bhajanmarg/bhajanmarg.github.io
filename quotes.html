<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quotes | BhajanMarg</title>

<style>

body{
font-family:Arial,sans-serif;
background:#fffaf0;
margin:0;
padding:0;
}

header{
background:#7a0000;
padding:20px;
text-align:center;
}

header a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:18px;
font-weight:bold;
}

h1{
text-align:center;
color:#7a0000;
margin-top:30px;
}

#search{
display:block;
margin:20px auto;
padding:12px;
width:350px;
max-width:90%;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.quote{
background:white;
max-width:800px;
margin:15px auto;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.quote h3{
color:#7a0000;
margin-bottom:10px;
}

.quote p{
font-size:18px;
line-height:1.7;
}

.noResult{
text-align:center;
padding:30px;
font-size:20px;
color:#7a0000;
}

</style>
</head>

<body>

<header>
<a href="index.html">Home</a>
<a href="quotes.html">Quotes</a>
<a href="links.html">Links</a>
<a href="gallery.html">Gallery</a>
<a href="jaap.html">Jaap</a>
</header>

<h1>प्रेरणादायक विचार</h1>

<input
id="search"
placeholder="Quote या Date Search">

<div id="quotes"></div><script>

let allQuotes=[];

function parseDate(dateStr){

const months={
Jan:0,
Feb:1,
Mar:2,
Apr:3,
May:4,
Jun:5,
Jul:6,
Aug:7,
Sep:8,
Oct:9,
Nov:10,
Dec:11
};

const parts=dateStr.split(" ");

if(parts.length!==3) return new Date(0);

const day=parseInt(parts[0]);
const month=months[parts[1]];
const year=parseInt(parts[2]);

return new Date(year,month,day);

}

fetch('quotes.json')
.then(r=>r.json())
.then(data=>{

const today=new Date();

today.setHours(23,59,59,999);

allQuotes=data.filter(q=>{

return parseDate(q.date)<=today;

});

allQuotes.sort((a,b)=>
parseDate(b.date)-parseDate(a.date)
);

showQuotes(allQuotes);

});

function showQuotes(arr){

const div=
document.getElementById('quotes');

div.innerHTML='';

if(arr.length===0){

div.innerHTML=
'<div class="noResult">कोई Quote नहीं मिला</div>';

return;

}

arr.forEach(q=>{

div.innerHTML+=`

<div class="quote">

<h3>${q.date}</h3>

<p>${q.quote}</p>

</div>

`;

});

}

document
.getElementById('search')
.addEventListener('input',e=>{

const value=
e.target.value.toLowerCase().trim();

const filtered=
allQuotes.filter(x=>

x.quote.toLowerCase().includes(value)

||

x.date.toLowerCase().includes(value)

);

showQuotes(filtered);

});

</script>

</body>
</html>
